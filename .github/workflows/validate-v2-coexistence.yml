name: Validate offline mixed v1/v2 package defaults

on:
  push:
    branches: [pkg-schema-v2]
    paths:
      - '.github/workflows/validate-v2-coexistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-default-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: c5c53739b0ad00073cf5cb516476170e3138fc16
          path: m-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 5980de14ad41de105ce74968a95fd3fc51c31d68
          path: tests
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: catalog
          persist-credentials: false
      - name: Run permanent offline mixed-schema lifecycle tests through rumiai-test
        shell: sh
        env:
          RUMIAI_TEST_M_OS_ROOT: ${{ github.workspace }}/m-source
          RUMIAI_TEST_PKG_CATALOG_ROOT: ${{ github.workspace }}/catalog
        run: |
          set -eu
          ./m-source/m osarch update
          ./tests/rumiai-test --list m-os/pkg-schema-v2
          ./tests/rumiai-test m-os/pkg-schema-v2
