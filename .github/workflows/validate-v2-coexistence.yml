name: Validate offline mixed v1/v2 package defaults

on:
  push:
    branches: [pkg-schema-v2]
    paths:
      - '.github/workflows/validate-v2-coexistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-default-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 380d0f43992c22123042cf389675c658e770d193
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: catalog
          persist-credentials: false
      - name: Run real v1/v2 installed-schema defaults and wrapper transitions, offline
        shell: sh
        run: |
          set -eu
          ./m osarch update
          ./m sh .github/scripts/pkg-v2-default-coexistence-test.sh
      - name: Verify consumer and provider selections across installed schemas, offline
        shell: sh
        run: |
          set -eu
          CATALOG_V2="$GITHUB_WORKSPACE/catalog/v2" ./m sh .github/scripts/pkg-v2-mixed-provider-test.sh
