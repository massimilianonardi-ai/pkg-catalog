name: Exact m-os repository-adapter PR validation

on:
  push:
    branches: [codex/m-os-adapter-runner]

permissions:
  contents: read

jobs:
  srv-s1-current-master-composition:
    name: S1 legacy live PID safety on composed current master
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact current m-os master
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: a78a24bd37446ac9b7d510af5facc5c110de595d
          path: m-os-master
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact S candidate
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 15a2c4f96584c07b92088e5530d4ecb09a9477b8
          path: m-os-s
          fetch-depth: 0
          persist-credentials: false
      - name: Compose without publishing a product merge
        shell: sh
        run: |
          set -eu
          test "$(git -C m-os-master rev-parse HEAD)" = a78a24bd37446ac9b7d510af5facc5c110de595d
          test "$(git -C m-os-s rev-parse HEAD)" = 15a2c4f96584c07b92088e5530d4ecb09a9477b8
          git -C m-os-master config user.name 'm-os CI composition'
          git -C m-os-master config user.email 'm-os-ci@example.invalid'
          git -C m-os-master merge --no-commit --no-ff 15a2c4f96584c07b92088e5530d4ecb09a9477b8
          test "$(git -C m-os-master rev-parse HEAD)" = a78a24bd37446ac9b7d510af5facc5c110de595d
          test "$(git -C m-os-master rev-parse MERGE_HEAD)" = 15a2c4f96584c07b92088e5530d4ecb09a9477b8
          if git -C m-os-master diff HEAD --quiet -- bin/sys/srv; then
            echo 'FAIL: composed tree did not apply S changes to bin/sys/srv' >&2
            exit 1
          fi
          printf 'PASS: composed master=%s candidate=%s\n' \
            "$(git -C m-os-master rev-parse HEAD)" \
            "$(git -C m-os-s rev-parse HEAD)"
      - name: Verify live legacy PID is rejected without process or state damage
        working-directory: m-os-master
        shell: sh
        run: |
          set -eu
          ./m osarch update
          service=m-s1-compose-safety
          state_dir=$(./m state-path user sys srv run)
          runtime_dir=$state_dir/$service
          [ ! -e "$runtime_dir" ] && [ ! -L "$runtime_dir" ]
          live_pid=
          cleanup() {
            if [ -n "$live_pid" ]; then
              kill "$live_pid" 2>/dev/null || :
              wait "$live_pid" 2>/dev/null || :
            fi
            if [ -d "$runtime_dir" ] && [ ! -L "$runtime_dir" ]; then
              rm -rf -- "$runtime_dir"
            fi
          }
          trap cleanup 0
          trap 'exit 130' HUP INT TERM
          sleep 90 &
          live_pid=$!
          kill -0 "$live_pid"
          mkdir -p -- "$runtime_dir"
          printf '%s\n' "$live_pid" > "$runtime_dir/pid"
          printf '%s\n' "$live_pid" > "$runtime_dir/owner"
          printf '%s\n' /bin/sleep > "$runtime_dir/command"
          printf '%s\n' legacy-provider@1 > "$runtime_dir/provider"
          status=0
          ./m srv start "$service" > "$GITHUB_WORKSPACE/legacy-start.log" 2>&1 || status=$?
          [ "$status" -eq 1 ] &&
            grep -F 'live-runtime-state-invalid' "$GITHUB_WORKSPACE/legacy-start.log" >/dev/null &&
            kill -0 "$live_pid" && [ -d "$runtime_dir" ] || {
              cat "$GITHUB_WORKSPACE/legacy-start.log" >&2
              echo "FAIL: legacy live PID start status=$status or process/state changed" >&2
              exit 1
            }
          status=0
          ./m srv stop -f "$service" > "$GITHUB_WORKSPACE/legacy-force-stop.log" 2>&1 || status=$?
          [ "$status" -eq 1 ] &&
            grep -F 'live-runtime-state-invalid' "$GITHUB_WORKSPACE/legacy-force-stop.log" >/dev/null &&
            kill -0 "$live_pid" && [ -d "$runtime_dir" ] || {
              cat "$GITHUB_WORKSPACE/legacy-force-stop.log" >&2
              echo "FAIL: legacy live PID forced-stop status=$status or process/state changed" >&2
              exit 1
            }
          echo 'PASS: composed current master rejects live legacy PID on start and stop -f without signaling or deleting state'

  gpgtools-macos-arm64:
    name: GPGTools exact artifact on macOS ARM64
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact GPGTools adapter PR head
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 620cf9f7a301d93a44d5702988c7bf59a8481292
          persist-credentials: false
      - name: Checkout pinned catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: main
          path: catalog
          persist-credentials: false
      - name: Configure isolated runtime and run authentic public package path
        shell: sh
        run: |
          set -eu
          test "$(uname -m)" = arm64
          test "$(git -C catalog rev-parse HEAD)" = 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          ./m osarch update
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"
          sh -n lib/sys/sh/pkg/repository/pkg-repository-gpgtools.lib.sh
          sh -n tests/pkg-repository-gpgtools-fixture.sh
          GPGTOOLS_FIXTURE_CATALOG="$GITHUB_WORKSPACE/catalog" GPGTOOLS_FIXTURE_TMP_BASE="$GITHUB_WORKSPACE/.gpgtools-fixture" SHELL=/bin/bash ./m shell -c '. ./tests/pkg-repository-gpgtools-fixture.sh'
          ./m pkg depend 'macgpg@2026.1+3633n!macos-arm64' >/dev/null
          ./m pkg install 'macgpg@2026.1+3633n!macos-arm64'
          versions=$(./m pkg versions macgpg)
          printf '%s\n' "$versions"
          case "$versions" in *'macgpg@2026.1+3633n!macos-arm64'*) :;; *) echo 'pinned GPGTools concrete missing' >&2; exit 1;; esac
          tmp=$(mktemp -d)
          cleanup() { rm -rf -- "$tmp"; }
          trap cleanup 0 HUP INT TERM
          mkdir -p -- "$tmp/home" "$tmp/gnupg"
          chmod 700 "$tmp/gnupg"
          output=$(HOME="$tmp/home" GNUPGHOME="$tmp/gnupg" ./m gpg --version)
          printf '%s\n' "$output"
          case "$output" in *'gpg (GnuPG'*) :;; *) echo 'packaged gpg did not report its version' >&2; exit 1;; esac
          echo 'PASS: exact GPGTools package installed and public command ran'

  podman-macos-arm64:
    name: Podman exact and latest artifacts on macOS ARM64
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact Podman adapter PR head
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 17188da89999f410740036d399144a008c127417
          persist-credentials: false
      - name: Checkout pinned catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: codex/podman-current-catalog
          path: catalog
          persist-credentials: false
      - name: Configure isolated runtime and run authentic public package path
        shell: sh
        run: |
          set -eu
          test "$(uname -m)" = arm64
          test "$(git -C catalog rev-parse HEAD)" = c8a39f8bd099d65ed8520de574800f220d6119e1
          ./m osarch update
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"
          sh -n lib/sys/sh/pkg/repository/pkg-repository-podman.lib.sh
          sh -n .github/scripts/m-podman-adapter-fixture.sh
          PODMAN_FIXTURE_CATALOG="$GITHUB_WORKSPACE/catalog" SHELL=/bin/sh ./m shell -c '. .github/scripts/m-podman-adapter-fixture.sh'
          anchor=$(cat catalog/v1/pkg/podman/macos-arm64/repository/version)
          test "$anchor" = v6.1.4
          ./m pkg install podman
          latest=$(./m pkg default podman)
          test "$latest" = podman@v6.1.4!macos-arm64
          latest_output=$(./m podman --version)
          printf '%s\n' "$latest_output"
          case "$latest_output" in *6.1.4*) :;; *) echo 'latest Podman version did not run' >&2; exit 1;; esac
          ./m pkg install podman@v6.1.3
          ./m pkg default podman@v6.1.3
          exact_output=$(./m podman --version)
          printf '%s\n' "$exact_output"
          case "$exact_output" in *6.1.3*) :;; *) echo 'exact Podman version did not run' >&2; exit 1;; esac
          versions=$(./m pkg versions podman)
          printf '%s\n' "$versions"
          printf '%s\n' "$versions" | grep -F 'podman@v6.1.3!macos-arm64' >/dev/null
          printf '%s\n' "$versions" | grep -F 'podman@v6.1.4!macos-arm64' >/dev/null
          echo 'PASS: exact v6.1.3 and Stable latest v6.1.4 Podman artifacts installed and public commands ran'

  chrome-for-testing-linux-arm64:
    name: Chrome for Testing exact and latest artifacts on Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout exact Chrome for Testing adapter PR head
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 2f2e75bf66ef67ba6661fd51a9af55a05b158905
          persist-credentials: false
      - name: Checkout pinned catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: main
          path: catalog
          persist-credentials: false
      - name: Configure isolated runtime and run authentic public package path
        shell: sh
        run: |
          set -eu
          test "$(git -C catalog rev-parse HEAD)" = 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          ./m osarch update
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"
          sh -n lib/sys/sh/pkg/repository/pkg-repository-chrome-for-testing.lib.sh
          sh -n .github/scripts/m-cft-adapter-fixture.sh
          CFT_FIXTURE_TMP_BASE="$GITHUB_WORKSPACE/.cft-fixture-tmp" .github/scripts/m-cft-adapter-fixture.sh
          ./m manual --no-pager pkg-repository-chrome-for-testing.lib.sh > /dev/null
          exact=chromium@153.0.8010.12!linux-arm64
          ./m pkg depend "$exact" > /dev/null
          ./m pkg install 'chromium!linux-arm64'
          latest=$(./m pkg default chromium)
          case "$latest" in chromium@*'!linux-arm64') :;; *) printf 'Unexpected Chromium default: %s\n' "$latest" >&2; exit 1;; esac
          [ -d "pkg/$latest/root" ]
          if [ "$latest" != "$exact" ]; then
            ./m pkg install "$exact"
          fi
          versions=$(./m pkg versions chromium)
          printf '%s\n' "$versions"
          printf '%s\n' "$versions" | grep -F '153.0.8010.12!linux-arm64' > /dev/null
          [ -d "pkg/$latest/root" ]
          latest_version=${latest#chromium@}
          latest_version=${latest_version%%!*}
          ./m pkg default "$latest"
          command_output=$(./m chromium --version)
          printf '%s\n' "$command_output"
          case "$command_output" in *"$latest_version"*) :;; *) echo "Chromium command did not run selected Stable $latest_version" >&2; exit 1;; esac
          echo "PASS: exact CfT anchor and current Stable installed through public pkg; Chromium command ran latest=$latest"

  geoserver-real-service:
    name: GeoServer exact/latest and WFS service on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact GeoServer adapter candidate
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: ff90b05d231c122c8db07659d92e32f3316709f0
          persist-credentials: false
      - name: Checkout exact published catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          path: catalog
          persist-credentials: false
      - name: Install genuine releases and exercise the public service path
        shell: sh
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = ff90b05d231c122c8db07659d92e32f3316709f0
          test "$(git -C catalog rev-parse HEAD)" = 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          ./m osarch update
          case "$RUNNER_OS" in
            Linux) expected_osarch=linux-arm64 ;;
            macOS) expected_osarch=macos-arm64 ;;
            *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          test "$(./m osarch)" = "$expected_osarch"
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' 'https://github.com/massimilianonardi-ai/pkg-catalog.git' > "$conf/catalog"
          cache_root=$(./m state-path system sys pkg cache)
          mkdir -p -- "$cache_root"
          cache="$cache_root/catalog-source"
          git clone --no-checkout "$GITHUB_WORKSPACE/catalog" "$cache"
          git -C "$cache" checkout --detach 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          test "$(git -C "$cache" rev-parse HEAD)" = 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          git -C "$cache" checkout -B snapshot 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          printf '%s\n' "$cache_root/catalog-source" > "$conf/catalog"
          cache="$cache_root/catalog"
          git clone --branch snapshot --single-branch "$cache_root/catalog-source" "$cache"
          sh -n lib/sys/sh/pkg/repository/pkg-repository-geoserver.lib.sh
          exact_dependencies=$(./m pkg depend geoserver@3.0.1)
          latest_dependencies=$(./m pkg depend geoserver)
          printf '%s\n' "$exact_dependencies" "$latest_dependencies"
          case "$exact_dependencies" in *'temurin@21+35!'*) : ;; *) echo 'exact GeoServer request did not select Temurin 21' >&2; exit 1 ;; esac
          case "$latest_dependencies" in *'temurin@21+35!'*) : ;; *) echo 'latest GeoServer request did not select Temurin 21' >&2; exit 1 ;; esac
          ./m pkg install "geoserver!$expected_osarch"
          latest=$(./m pkg default geoserver)
          case "$latest" in geoserver@*) : ;; *) echo "unexpected latest GeoServer concrete: $latest" >&2; exit 1 ;; esac
          if [ "$latest" != "geoserver@3.0.1" ] && [ "$latest" != "geoserver@3.0.1!$expected_osarch" ]; then
            ./m pkg install geoserver@3.0.1
          fi
          exact=geoserver@3.0.1!$expected_osarch
          versions=$(./m pkg versions geoserver)
          case "$versions" in *'geoserver@3.0.1'*) : ;; *) echo "exact GeoServer 3.0.1 concrete missing: $exact" >&2; exit 1 ;; esac
          work="$GITHUB_WORKSPACE/.geoserver-work"
          mkdir -p -- "$work"
          versions=$(./m pkg versions geoserver)
          printf '%s\n' "$versions"
          case "$versions" in *"$latest"*) : ;; *) echo "latest GeoServer concrete missing: $latest" >&2; exit 1 ;; esac
          ./m pkg provider default java temurin@21+35
          ./m pkg provider default geoserver "$latest"
          cleanup() {
            ./m srv stop geoserver >/dev/null 2>&1 || :
            rm -rf -- "$work"
          }
          trap cleanup 0
          trap 'exit 130' HUP INT TERM
          ./m srv start geoserver
          i=0
          while ! curl -fsS 'http://127.0.0.1:8080/geoserver/ows?service=WFS&version=2.0.0&request=GetCapabilities' -o "$work/wfs.xml"
          do
            [ "$i" -lt 30 ] || { cat "$work/wfs.xml" 2>/dev/null || :; exit 1; }
            i=$((i + 1))
            sleep 2
          done
          grep -E '<(wfs:)?WFS_Capabilities([[:space:]>])' "$work/wfs.xml" >/dev/null
          ./m srv stop geoserver
          trap - 0 HUP INT TERM
          rm -rf -- "$work"
          echo "PASS: exact 3.0.1 and latest $latest GeoServer installs and live WFS service on $expected_osarch"

  graalvm-four-platforms:
    name: GraalVM exact/latest public install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            osarch: linux-arm64
            host_osarch: linux-arm64
          - os: ubuntu-24.04
            osarch: linux-x86_64
            host_osarch: linux-x86_64
          - os: macos-15
            osarch: macos-arm64
            host_osarch: macos-arm64
          - os: ubuntu-24.04
            osarch: windows-x86_64
            host_osarch: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout exact GraalVM adapter PR head
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 73b238d42966c0da1d2aebb48b50bfba59b484cf
          persist-credentials: false
      - name: Checkout exact package catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          path: catalog
          persist-credentials: false
      - name: Install exact and latest GraalVM through public pkg commands
        shell: bash
        env:
          EXPECTED_OSARCH: ${{ matrix.osarch }}
          EXPECTED_HOST_OSARCH: ${{ matrix.host_osarch }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 73b238d42966c0da1d2aebb48b50bfba59b484cf
          test "$(git -C catalog rev-parse HEAD)" = 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          git -C catalog checkout -B snapshot 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          ./m osarch update
          test "$(./m osarch)" = "$EXPECTED_HOST_OSARCH"
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"
          sh -n lib/sys/sh/pkg/repository/pkg-repository-graalvm.lib.sh
          ./m manual --no-pager pkg-repository-graalvm.lib.sh > /dev/null

          exact="graalvm@25.3.4.1!$EXPECTED_OSARCH"
          ./m pkg depend "$exact" > /dev/null
          if [ "$EXPECTED_OSARCH" = windows-x86_64 ]; then
            target_class="graalvm!$EXPECTED_OSARCH"
            repository="$GITHUB_WORKSPACE/catalog/v1/pkg/graalvm/windows-x86_64/repository"
            range="$GITHUB_WORKSPACE/catalog/v1/pkg/graalvm/windows-x86_64/n0001=25.3.4.1"
            latest=$(GRAALVM_REPOSITORY="$repository" ./m shell -c '. "$m_LIB_DIR/sys/sh/core.lib.sh"; loadsyslib "json"; . "$m_LIB_DIR/sys/sh/pkg/repository/pkg-repository-graalvm.lib.sh"; pkg_repository_resolve_version "$GRAALVM_REPOSITORY"')
            exact_artifact=$(GRAALVM_REPOSITORY="$repository" GRAALVM_RANGE="$range" ./m shell -c '. "$m_LIB_DIR/sys/sh/core.lib.sh"; loadsyslib "json"; . "$m_LIB_DIR/sys/sh/pkg/repository/pkg-repository-graalvm.lib.sh"; pkg_repository_resolve_artifact "$GRAALVM_REPOSITORY" "$GRAALVM_RANGE" 25.3.4.1')
            latest_artifact=$(GRAALVM_REPOSITORY="$repository" GRAALVM_RANGE="$range" GRAALVM_VERSION="$latest" ./m shell -c '. "$m_LIB_DIR/sys/sh/core.lib.sh"; loadsyslib "json"; . "$m_LIB_DIR/sys/sh/pkg/repository/pkg-repository-graalvm.lib.sh"; pkg_repository_resolve_artifact "$GRAALVM_REPOSITORY" "$GRAALVM_RANGE" "$GRAALVM_VERSION"')
            printf '%s\n' "$exact_artifact" "$latest_artifact"
            case "$exact_artifact" in *'url=https://github.com/graalvm/graalvm-ce-builds/releases/download/'*'size='*'digest=sha256:'*) :;; *) echo 'Windows exact artifact metadata invalid' >&2; exit 1;; esac
            case "$latest_artifact" in *'url=https://github.com/graalvm/graalvm-ce-builds/releases/download/'*'size='*'digest=sha256:'*) :;; *) echo 'Windows latest artifact metadata invalid' >&2; exit 1;; esac
            echo "PASS: exact/latest Windows GraalVM public package resolution and genuine artifact metadata; latest=$latest. No Windows binary installation is claimed from a Linux host."
            exit 0
          fi
          ./m pkg install graalvm
          latest=$(./m pkg default graalvm)
          case "$latest" in graalvm@*"!$EXPECTED_OSARCH") :;; *) printf 'Unexpected latest GraalVM default: %s\n' "$latest" >&2; exit 1;; esac
          if [ "$latest" != "$exact" ]; then
            ./m pkg install "$exact"
          fi
          versions=$(./m pkg versions graalvm)
          printf '%s\n' "$versions"
          case "$versions" in *"$exact"*) :;; *) echo 'exact GraalVM concrete missing after install' >&2; exit 1;; esac
          case "$versions" in *"$latest"*) :;; *) echo 'latest GraalVM concrete missing' >&2; exit 1;; esac
          ./m pkg provider default java "$exact"
          exact_output=$(./m java -version 2>&1)
          printf '%s\n' "$exact_output"
          case "$exact_output" in *'GraalVM CE'*) :;; *) echo 'exact provider did not run GraalVM' >&2; exit 1;; esac

          ./m pkg provider default java "$latest"
          selected=$(./m pkg provider default java)
          case "$selected" in *"$latest"*) :;; *) printf 'Java provider selector is %s, expected %s\n' "$selected" "$latest" >&2; exit 1;; esac
          latest_output=$(./m java -version 2>&1)
          printf '%s\n' "$latest_output"
          case "$latest_output" in *'GraalVM CE'*) :;; *) echo 'latest provider did not run GraalVM' >&2; exit 1;; esac
          [ "$latest_output" != "$exact_output" ] || { echo 'exact and latest Java providers ran identical version output' >&2; exit 1; }
          echo "PASS: exact and latest GraalVM public install/provider path on $EXPECTED_OSARCH; latest=$latest"
