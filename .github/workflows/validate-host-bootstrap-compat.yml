name: Probe macOS and Windows bootstrap portability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-host-bootstrap-compat.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-bootstrap-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: c970a21b15d16ae05571304ddbd5b9e3a0093680
          path: m-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: catalog
          persist-credentials: false
      - name: Confirm macOS pkg install initialization uses portable chmod
        shell: bash
        run: |
          set -eu
          test "$(git -C m-source rev-parse HEAD)" = c970a21b15d16ae05571304ddbd5b9e3a0093680
          grep -F 'chmod 777 "$pkg_install_tmp_root"' m-source/lib/sys/sh/pkg/pkg-install.lib.sh
          grep -F 'chmod 777 "$pkg_install_cache_root"' m-source/lib/sys/sh/pkg/pkg-install.lib.sh
          ./m-source/m osarch update
          ./m-source/m sh -c 'printf "BOOTSTRAP_OK osarch=%s\n" "$m_OSARCH"'
          git -C catalog switch -c ci-catalog-smoke
          conf=$(./m-source/m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$PWD/catalog" > "$conf/catalog"
          if ./m-source/m pkg install ci-nonexistent-package@1.0.0 > install.out 2> install.err
          then
            echo 'unexpected installation success' >&2
            exit 1
          fi
          ! grep -F 'pkg-install.initialization-failed' install.err
          grep -F 'pkg-install.root-resolution-failed' install.err
          echo 'PASS: macOS public pkg install reached catalog resolution'

  windows:
    needs: macos
    if: ${{ always() }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: c970a21b15d16ae05571304ddbd5b9e3a0093680
          path: m-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: catalog
          persist-credentials: false
      - name: Verify LF inventory, bootstrap and pkg install initialization on Windows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C m-source rev-parse HEAD)" = c970a21b15d16ae05571304ddbd5b9e3a0093680
          test "$(git -C m-source check-attr eol -- state/system/profile/.inventory)" = 'state/system/profile/.inventory: eol: lf'
          git -C m-source show HEAD:state/system/profile/.inventory |
            cmp - m-source/state/system/profile/.inventory
          ./m-source/m osarch update
          ./m-source/m sh -c 'test "$m_OSARCH" = windows-x86_64'
          echo 'PASS: exact LF profile inventory and real Git Bash m bootstrap'
          git -C catalog switch -c ci-catalog-smoke
          conf=$(./m-source/m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$PWD/catalog" > "$conf/catalog"
          if ./m-source/m pkg install ci-nonexistent-package@1.0.0 > install.out 2> install.err
          then
            echo 'unexpected installation success' >&2
            exit 1
          fi
          if grep -F 'pkg-install.initialization-failed' install.err
          then
            echo 'FAIL: Windows public pkg install stopped during initialization' >&2
            cat install.err >&2
            # Diagnose only the failed real public entrypoint. No upstream package
            # exists for this request, so the trace cannot enter a release API.
            sh -x ./m-source/m pkg install ci-nonexistent-package@1.0.0 > install-trace.out 2> install-trace.err || :
            tail -n 180 install-trace.err >&2
            exit 1
          fi
          grep -F 'pkg-install.root-resolution-failed' install.err
          echo 'PASS: Windows public pkg install reached catalog resolution'
