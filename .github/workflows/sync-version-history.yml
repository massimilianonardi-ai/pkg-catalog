name: Sync GitHub release histories

on:
  push:
    branches:
      - main
    paths:
      - sync-version-history.mjs
      - .github/workflows/sync-version-history.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate reconciler syntax
        run: node --check sync-version-history.mjs
      - name: Reconcile catalog with upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" -eq 7 ]; then
            node sync-version-history.mjs --full
          else
            node sync-version-history.mjs
          fi
      - name: Publish changes
        run: |
          git add -- pkg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync GitHub release histories"
            git push origin HEAD:main
          fi
