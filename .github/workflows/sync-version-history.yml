name: Sync GitHub release histories

on:
  push:
    branches:
      - main
    paths:
      - sync-version-history.mjs
      - test/sync-version-history.test.mjs
      - v1/pkg/graalvm/**/repository/versions
      - .github/workflows/sync-version-history.yml
  pull_request:
    paths:
      - sync-version-history.mjs
      - test/sync-version-history.test.mjs
      - v1/pkg/graalvm/**/repository/versions
      - .github/workflows/sync-version-history.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate reconciler syntax
        run: node --check sync-version-history.mjs
      - name: Test release normalization and catalog stream fixtures
        run: node --test test/sync-version-history.test.mjs
      - name: Reconcile catalog with upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" -eq 7 ]; then
            node sync-version-history.mjs --full
          else
            node sync-version-history.mjs
          fi
      - name: Verify non-main runs cannot publish
        if: github.ref != 'refs/heads/main'
        run: |
          test "$GITHUB_REF" != "refs/heads/main"
          echo 'PASS: non-main history validation will not publish to main'
      - name: Publish changes
        if: github.ref == 'refs/heads/main'
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git symbolic-ref --short HEAD)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main=$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')
          test "$remote_main" = "$GITHUB_SHA"
          git add -- v1/pkg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync GitHub release histories"
            git push origin HEAD:main
          fi
