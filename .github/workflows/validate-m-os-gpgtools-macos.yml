name: Validate m-os GPGTools adapter on macOS ARM64

on:
  push:
    branches: [codex/gpgtools-arm64-validation]
    paths:
      - .github/workflows/validate-m-os-gpgtools-macos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpgtools-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact GPGTools adapter head
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: cd54a908530e5b53179ed47e849f8a91d771a339
          path: m-os
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact package catalog snapshot
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          path: catalog
          fetch-depth: 0
          persist-credentials: false
      - name: Configure isolated runtime and execute public GPGTools path
        working-directory: m-os
        shell: sh
        run: |
          set -eu
          test "$(uname -m)" = arm64
          test "$(git -C . rev-parse HEAD)" = cd54a908530e5b53179ed47e849f8a91d771a339
          test "$(git -C "$GITHUB_WORKSPACE/catalog" rev-parse HEAD)" = 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          test "$(git -C "$GITHUB_WORKSPACE/catalog" rev-parse origin/main)" = 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          git -C "$GITHUB_WORKSPACE/catalog" switch --create main --track origin/main

          ./m osarch update
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"

          sh -n lib/sys/sh/pkg/repository/pkg-repository-gpgtools.lib.sh
          sh -n tests/pkg-repository-gpgtools-fixture.sh
          GPGTOOLS_FIXTURE_CATALOG="$GITHUB_WORKSPACE/catalog" \
          GPGTOOLS_FIXTURE_TMP_BASE="$GITHUB_WORKSPACE/.gpgtools-fixture" \
          SHELL=/bin/bash ./m shell -c '. ./tests/pkg-repository-gpgtools-fixture.sh'

          ./m pkg depend 'macgpg!macos-arm64' >/dev/null
          ./m pkg depend 'macgpg@2026.1+3633n!macos-arm64' >/dev/null
          ./m pkg install 'macgpg@2026.1+3633n!macos-arm64'
          ./m pkg default macgpg@2026.1+3633n!macos-arm64
          selected=$(./m pkg default macgpg)
          test "$selected" = macgpg@2026.1+3633n!macos-arm64
          versions=$(./m pkg versions macgpg)
          printf '%s\n' "$versions"
          case "$versions" in *'macgpg@2026.1+3633n!macos-arm64'*) :;; *) echo 'pinned GPGTools concrete missing' >&2; exit 1;; esac

          tmp=$(mktemp -d)
          cleanup() { rm -rf -- "$tmp"; }
          trap cleanup 0 HUP INT TERM
          mkdir -p -- "$tmp/home" "$tmp/gnupg"
          chmod 700 "$tmp/gnupg"
          output=$(HOME="$tmp/home" GNUPGHOME="$tmp/gnupg" ./m gpg --version)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq '^gpg \(GnuPG/[^)]+\) [0-9]' || { echo 'packaged gpg did not report a version line' >&2; exit 1; }
          echo 'PASS: exact GPGTools package installed, selected, listed and executed with isolated user state'
