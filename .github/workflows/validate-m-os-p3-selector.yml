name: P3 pinned facility provider exact-selector real CLI regression

on:
  push:
    branches: [m-os-completion-p3-selector-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-provider:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: e204b627b3c20e45d5c8a27b07b5294c298c36bc
          path: m-os
          persist-credentials: false
      - name: Exercise real public pinned and unpinned facility selectors
        shell: sh
        working-directory: m-os
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = e204b627b3c20e45d5c8a27b07b5294c298c36bc ] || exit 1
          /bin/sh .github/scripts/m-pkg-p3-pinned-selector.sh
