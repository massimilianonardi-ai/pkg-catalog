name: P3 pinned facility provider exact-selector real CLI regression

on:
  push:
    branches: [m-os-completion-p3-selector-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-provider:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: d2d379992ecdf9aaaf48d38410263bb31e38b052
          path: m-os
          persist-credentials: false
      - name: Exercise real public pinned and unpinned facility selectors
        shell: sh
        working-directory: m-os
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = d2d379992ecdf9aaaf48d38410263bb31e38b052 ] || exit 1
          /bin/sh .github/scripts/m-pkg-p3-pinned-selector.sh
