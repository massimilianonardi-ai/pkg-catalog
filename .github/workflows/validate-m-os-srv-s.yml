name: Temporary exact-commit m-os S1/S2 validation

on:
  push:
    branches: [m-os-completion-s-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  srv-s:
    name: srv ${{ matrix.case }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: offline-safety-ubuntu
            os: ubuntu-latest
            workflow: m-srv-safety-public.yml
          - case: offline-safety-macos-arm64
            os: macos-latest
            workflow: m-srv-safety-public.yml
          - case: offline-safety-macos15-intel
            os: macos-15-intel
            workflow: m-srv-safety-public.yml
          - case: published-provider-ubuntu
            os: ubuntu-latest
            workflow: m-srv-provider-live.yml
          - case: host-user-ubuntu
            os: ubuntu-latest
            workflow: m-srv-host-user-local.yml
          - case: host-user-macos-arm64
            os: macos-latest
            workflow: m-srv-host-user-local.yml
    steps:
      - name: Checkout pinned current m-os master
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: a78a24bd37446ac9b7d510af5facc5c110de595d
          fetch-depth: 0
          path: m-os
          persist-credentials: false
      - name: Checkout exact persistent-supervisor candidate without publishing it
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: ffd1ad3ac1e2762144aff0e74c60d23bb979f2cd
          fetch-depth: 0
          path: m-os-srv-supervisor
          persist-credentials: false
      - name: Checkout exact current pkg-catalog main
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 1559223f4e3e6d1764ebbf0b7f136a2dfbefdf3b
          fetch-depth: 1
          path: pkg-catalog
          persist-credentials: false
      - name: Merge exact S and master revisions only in CI workspace
        shell: bash
        run: |
          set -euo pipefail
          git -C m-os fetch ../m-os-srv-supervisor ffd1ad3ac1e2762144aff0e74c60d23bb979f2cd
          git -C m-os -c user.name=RumiAI-CI -c user.email=ci@example.invalid \
            merge --no-ff --no-edit FETCH_HEAD
          git -C m-os merge-base --is-ancestor a78a24bd37446ac9b7d510af5facc5c110de595d HEAD
          git -C m-os merge-base --is-ancestor ffd1ad3ac1e2762144aff0e74c60d23bb979f2cd HEAD
          test "$(git -C pkg-catalog rev-parse HEAD)" = 1559223f4e3e6d1764ebbf0b7f136a2dfbefdf3b
          printf 'PASS: exact-source local master+supervisor composition and catalog pin\n'
          git -C m-os log -1 --format='%H %P'
      - name: Configure exact catalog for public m package operations
        shell: bash
        working-directory: m-os
        run: |
          set -euo pipefail
          ./m osarch update
          catalog=$(CDPATH= cd -- ../pkg-catalog && pwd -P)
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$catalog" > "$conf/catalog"
          test "$(cat "$conf/catalog")" = "$catalog"
      - name: Build the distribution-required service supervisor
        shell: sh
        working-directory: m-os
        run: ./tools/build-srv-supervisor.sh
      - name: Run the original S workflow's public-command script
        shell: bash
        working-directory: m-os
        run: |
          set -euo pipefail
          python3 - ".github/workflows/${{ matrix.workflow }}" "$RUNNER_TEMP/m-os-srv-script.sh" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines(keepends=True)
          indices = [i for i, line in enumerate(source) if line.rstrip("\r\n") == "        run: |"]
          if len(indices) != 1:
              raise SystemExit("INFRASTRUCTURE: expected one shell run block in source workflow")
          script = []
          for line in source[indices[0] + 1:]:
              if line.strip() and not line.startswith("          "):
                  break
              script.append(line[10:] if line.startswith("          ") else "\n")
          script_text = "".join(script)
          workflow_name = pathlib.Path(sys.argv[1]).name
          if not script_text.strip():
              raise SystemExit("INFRASTRUCTURE: source workflow shell block changed unexpectedly")
          if workflow_name == "m-srv-provider-live.yml":
              if script_text.strip() != ".github/scripts/m-srv-provider-live.sh":
                  raise SystemExit("INFRASTRUCTURE: provider workflow no longer invokes its checked-in public test script")
          elif not script_text.lstrip().startswith("set -eu"):
              raise SystemExit("INFRASTRUCTURE: inline S workflow shell block changed unexpectedly")
          pathlib.Path(sys.argv[2]).write_text("".join(script), encoding="utf-8")
          PY
          /bin/sh -n "$RUNNER_TEMP/m-os-srv-script.sh"
          if [ "${{ matrix.workflow }}" = m-srv-safety-public.yml ]; then
            PS4='+ srv-safety: ' /bin/sh -x "$RUNNER_TEMP/m-os-srv-script.sh"
          else
            /bin/sh "$RUNNER_TEMP/m-os-srv-script.sh"
          fi
