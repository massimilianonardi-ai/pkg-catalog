name: P4 exact-head derived facility map validation

on:
  push:
    branches: [m-os-completion-p4-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facility-map-and-provider-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 2147dc2df96f595353aa0850b8319f9dcdb55a11
          path: m-os
          persist-credentials: false
      - name: Pin exact P4 product source and prepare its runtime
        shell: sh
        working-directory: m-os
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = 2147dc2df96f595353aa0850b8319f9dcdb55a11 ] || exit 1
          ./m osarch update
      - name: Verify derived facility map ordering and offline recovery
        shell: sh
        working-directory: m-os
        run: /bin/sh .github/scripts/m-pkg-p4-facility-map-unit.sh
      - name: Verify authentic released-provider map lifecycle and default projections
        shell: sh
        working-directory: m-os
        run: /bin/sh .github/scripts/m-pkg-p3-provider-versions.sh
