name: P4 exact-head derived facility map validation

on:
  push:
    branches: [m-os-completion-p4-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facility-map-and-provider-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: a78a24bd37446ac9b7d510af5facc5c110de595d
          path: m-os
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 6e5f81a2f9f2a278a4e717300a866a8783d50a3f
          path: m-os-test-harness
          persist-credentials: false
      - name: Pin exact P4 product source and prepare its runtime
        shell: sh
        working-directory: m-os
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = a78a24bd37446ac9b7d510af5facc5c110de595d ] || exit 1
          ./m osarch update
      - name: Verify derived facility map ordering and offline recovery
        shell: sh
        working-directory: m-os
        run: /bin/sh .github/scripts/m-pkg-p4-facility-map-unit.sh
      - name: Verify authentic released-provider map lifecycle and default projections
        shell: sh
        working-directory: m-os
        env:
          M_P3_REPO_ROOT: ${{ github.workspace }}/m-os
          M_P3_CATALOG_REF: 1559223f4e3e6d1764ebbf0b7f136a2dfbefdf3b
          M_P3_CATALOG_BRANCH: p3-ci-main
        run: |
          set -eu
          [ "$(git -C ../m-os-test-harness rev-parse HEAD)" = 6e5f81a2f9f2a278a4e717300a866a8783d50a3f ]
          /bin/sh ../m-os-test-harness/.github/scripts/m-pkg-p3-provider-versions.sh
