name: Validate m-os GraalVM adapter on hosted Windows

on:
  push:
    branches: [codex/gpgtools-arm64-validation]
    paths:
      - .github/workflows/validate-m-os-graalvm-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graalvm-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      MSYS: winsymlinks:nativestrict
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact GraalVM adapter and P4 candidate
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: d4b4e387c0748599b7389daa7cf75a18b64b42c3
          path: m-os
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact GraalVM catalog history
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 50faddb36f9c3e7c12fa53d46b94dd8098fa857b
          path: catalog
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source pins and initialize m
        working-directory: m-os
        run: |
          set -eux
          git config --global core.autocrlf false
          test "$(git rev-parse HEAD)" = d4b4e387c0748599b7389daa7cf75a18b64b42c3
          test "$(git -C "$GITHUB_WORKSPACE/catalog" rev-parse HEAD)" = 50faddb36f9c3e7c12fa53d46b94dd8098fa857b
          test "$(git -C "$GITHUB_WORKSPACE/catalog" rev-parse HEAD^)" = 82a5df1c428f31a250e3eaba4253f33fac3ec0ac
          git -C "$GITHUB_WORKSPACE/catalog" switch --create main
          git -C "$GITHUB_WORKSPACE/catalog" branch --set-upstream-to=origin/main main
          git config core.symlinks true
          git checkout --force HEAD -- bin/ai-osarch bin/ext-osarch bin/sys-osarch
          test -L bin/sys-osarch
          ./m osarch update
          test "$(./m osarch)" = windows-x86_64
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          catalog_path=$(cygpath -u "$GITHUB_WORKSPACE/catalog")
          printf '%s\n' "$catalog_path" > "$conf/catalog"
      - name: Resolve exact and stable-latest package requests
        working-directory: m-os
        run: |
          set -eux
          m_LOG_LEVEL=trace ./m pkg depend graalvm@25.3.4.1 || status=$?
          if [ "${status:-0}" -ne 0 ]
          then
            cp m "$RUNNER_TEMP/m-bootstrap"
            sed -i 's/^exec "\$@"/exec bash -x "\$@"/' m
            grep -F 'exec bash -x "$@"' m
            ./m pkg depend graalvm@25.3.4.1 2> "$RUNNER_TEMP/graalvm-depend.trace" || :
            cp "$RUNNER_TEMP/m-bootstrap" m
            tail -n 500 "$RUNNER_TEMP/graalvm-depend.trace"
            conf=$(./m state-path system sys pkg conf)
            catalog=$(cat "$conf/catalog")
            printf 'catalog-config=%s\n' "$catalog"
            git -C "$catalog" rev-parse HEAD
            ls -ld -- "$catalog/v1/pkg/graalvm/windows-x86_64" \
              "$catalog/v1/pkg/graalvm/windows-x86_64/n0001=25.3.4.1" \
              "$catalog/v1/pkg/graalvm/windows-x86_64/repository"
            cat "$catalog/v1/pkg/graalvm/windows-x86_64/repository/type" \
              "$catalog/v1/pkg/graalvm/windows-x86_64/repository/owner" \
              "$catalog/v1/pkg/graalvm/windows-x86_64/repository/repository" \
              "$catalog/v1/pkg/graalvm/windows-x86_64/repository/versions"
            ./m http-fetch \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -- 'https://api.github.com/repos/graalvm/graalvm-ce-builds/releases?per_page=100&page=1' |
              ./bin/sys/json -r '.[].tag_name' | grep -x 'graal-25.3.4.1'
            command -p -v sort
            sort_tab=$(printf '\t')
            printf 'b\t2\na\t1\n' | LC_ALL=C command -p sort -t "$sort_tab" -k1,1
            exit "$status"
          fi
          m_LOG_LEVEL=trace ./m pkg depend graalvm
      - name: Install, select and execute exact and stable-latest GraalVM
        working-directory: m-os
        run: |
          set -eu
          ./m pkg install graalvm
          latest=$(./m pkg default graalvm)
          case "$latest" in graalvm@*) : ;; *) echo 'unversioned install did not select a GraalVM concrete' >&2; exit 1 ;; esac
          ./m pkg install graalvm@25.3.4.1
          versions=$(./m pkg versions graalvm)
          printf '%s\n' "$versions"
          case "$versions" in *'graalvm@25.3.4.1!windows-x86_64'*) : ;; *) echo 'exact GraalVM anchor install missing' >&2; exit 1 ;; esac
          case "$versions" in *"$latest"*) : ;; *) echo 'selected latest concrete is not installed' >&2; exit 1 ;; esac
          echo "checkpoint: installed exact and latest ($latest)"
          ./m pkg provider default java "$latest"
          echo 'checkpoint: provider default set'
          provider=$(./m pkg provider default java)
          printf 'provider=%s expected=%s\n' "$provider" "$latest"
          [ "$provider" = "$latest" ] || { echo 'provider default mismatch' >&2; exit 1; }
          facility_default="$PWD/facility/java/25/windows-x86_64/default"
          facility_target=$(readlink -f "$facility_default") || { echo 'facility default cannot be resolved' >&2; ls -la "$PWD/facility/java/25/windows-x86_64"; exit 1; }
          expected_target=$(realpath "pkg/$latest") || { echo 'installed concrete path cannot be resolved' >&2; exit 1; }
          printf 'facility-default=%s expected=%s\n' "$facility_target" "$expected_target"
          [ "$facility_target" = "$expected_target" ] || { echo 'facility default points to wrong concrete' >&2; exit 1; }
          echo 'checkpoint: provider facility maps to selected concrete'
          java_path="$PWD/pkg/$latest/root/bin/java.exe"
          [ -f "$java_path" ] || { echo "Java executable missing: $java_path" >&2; find "pkg/$latest" -maxdepth 4 -iname 'java.exe' -print; exit 1; }
          ls -l -- "$java_path"
          file -- "$java_path"
          java_windows_path=$(cygpath -w "$java_path")
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
            "& '$java_windows_path' -version; exit \$LASTEXITCODE" 2>&1 |
            tee "$RUNNER_TEMP/java-version.txt"
          grep -qi 'GraalVM' "$RUNNER_TEMP/java-version.txt"
          echo "PASS: exact 25.3.4.1 and stable latest $latest installed and selected on windows-x86_64"
