name: Validate v2 direct package entrypoints

on:
  push:
    branches: [pkg-schema-v2]
    paths:
      - 'v2/**'
      - '.github/workflows/validate-v2-m.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-jq:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout v2 catalog branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact autonomous v2 runtime
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m
          ref: e66baf90200489fc4f12af1f0793d0f522482be8
          path: m-source
          persist-credentials: false
      - name: Run real package installation from exact v2 snapshot
        shell: sh
        run: |
          set -eux
          ./m-source/m osarch update
          conf=$(./m-source/m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE" > "$conf/catalog"
          ./m-source/m sh -c '
            . "$m_LIB_DIR/sys/sh/core.lib.sh" || exit 1
            loadsyslib "pkg/pkg-catalog" || exit 1
            work=$(mktemp -d) || exit 1
            cache=$(mktemp -d) || exit 1
            pkg_catalog_init selected revision "$work" "$cache" || exit 1
            [ "$revision" = "$GITHUB_SHA" ] || exit 1
            [ -d "${selected%/v1}/v2/pkg/jq" ] || exit 1
            rm -rf -- "$work" "$cache"
          '
          echo 'CHECKPOINT: v2 catalog snapshot verified'
          installed=
          # Retry transient upstream network failures; integrity, malformed
          # definitions and failed execution assertions are never retried.
          for attempt in 1 2 3
          do
            if ./m-source/m pkg install jq@jq-1.8.2
            then
              installed=yes
              break
            fi
            [ "$attempt" -lt 3 ] || break
            sleep 4
          done
          [ "$installed" = yes ]
          echo 'CHECKPOINT: v2 pkg install completed'
          find m-source/pkg -maxdepth 4 -type l -o -name schema | sort
          concrete=$(./m-source/m pkg default jq)
          case "$concrete" in jq@jq-1.8.2!*) : ;; *) exit 1 ;; esac
          [ "$(cat "m-source/pkg/$concrete/schema")" = v2 ]
          case "$(readlink "m-source/pkg/$concrete/link/bin/jq")" in ../../root/jq-*) : ;; *) exit 1 ;; esac
          osarch=${concrete##*!}
          test -L "m-source/bin/ext-$osarch/jq"
          [ "$(./m-source/m jq -n '21*2')" = 42 ]
          [ "$(readlink "m-source/pkg/$concrete/link/bin/jq-wrapped")" = "../../cmd/jq-wrapped" ]
          case "$(readlink "m-source/pkg/$concrete/link/target/jq-wrapped")" in ../../root/jq-*) : ;; *) exit 1 ;; esac
          test -L "m-source/bin/ext-$osarch/jq-wrapped"
          [ "$(./m-source/m jq-wrapped '21*2')" = 42 ]
          CONCRETE="$concrete" ./m-source/m sh -ec '
            . "$m_LIB_DIR/sys/sh/core.lib.sh"
            context "pkg=$CONCRETE"
            [ "$(command -v jq)" = "$m_PKG_DIR/$CONCRETE/link/bin/jq" ]
            [ "$(command -v jq-wrapped)" = "$m_PKG_DIR/$CONCRETE/link/bin/jq-wrapped" ]
            [ "$(jq -n "6*7")" = 42 ]
            [ "$(jq-wrapped "6*7")" = 42 ]
            context
          '
          echo 'PASS: real public v2 jq install, direct/wrapped commands and context'
